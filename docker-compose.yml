# Agency & Client Management SaaS — local development stack
# Run everything:  docker compose up
# Services and host ports:
#   web     Next.js        http://localhost:3000
#   api     Laravel        http://localhost:8000  (health: /api/v1/health)
#   mysql   MySQL 8        localhost:3306
#   redis   Redis 7        localhost:6379
#   mailpit Mail UI        http://localhost:8025  (SMTP: 1025)
#   minio   S3 console     http://localhost:9001  (API: 9000)
name: agency-saas

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-agency_saas}
      DB_USERNAME: ${DB_USERNAME:-agency}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FILESYSTEM_DISK: local
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-agency-saas}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost:8000/api/v1/health') ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
             php artisan serve --host=0.0.0.0 --port=8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      # Run mode of the web app, switchable from the host shell: dev (default)
      # or prod. See the command below.
      WEB_MODE: ${WEB_MODE:-dev}
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      # Server-side (BFF) calls must reach the API over the compose network —
      # without this the web container falls back to localhost (= itself)
      # and every login fails with "fetch failed" / 500 (FIX-004).
      INTERNAL_API_URL: http://api:8000/api
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    # WEB_MODE=dev (default): hot-reload dev server. Pages compile on first
    # visit, separately per locale, so navigation feels slow in this mode;
    # use it for development only.
    # WEB_MODE=prod: full production build + start. Use it for acceptance
    # testing so page transitions behave like the real deployment:
    #   WEB_MODE=prod docker compose up -d web
    command: sh -c "pnpm install && if [ \"$${WEB_MODE}\" = \"prod\" ]; then pnpm build && pnpm start; else pnpm dev; fi"

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-agency_saas}
      MYSQL_USER: ${DB_USERNAME:-agency}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # S3 storage is OPTIONAL until the file features land (Group 7): MinIO no
  # longer publishes a free public image (Docker Hub removed, Quay returns
  # 401), so this service sits behind the `storage` profile and is NOT part
  # of the default stack. Enable with: docker compose --profile storage up -d
  minio:
    profiles: ["storage"]
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  redis_data:
  minio_data:
  api_vendor:
  web_node_modules:
